name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kairuha.slnx

      - name: Build
        run: dotnet build Kairuha.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Kairuha.slnx --configuration Release --no-build --no-restore

      - name: Check formatting
        run: dotnet format Kairuha.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Pack
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP "kairuha-packages"
          New-Item -ItemType Directory -Force -Path $packages | Out-Null
          dotnet pack src/Kairuha/Kairuha.csproj --configuration Release --no-build --no-restore --output $packages
          dotnet pack templates/Kairuha.Templates/Kairuha.Templates.csproj --configuration Release --no-build --no-restore --output $packages
          "KAIRUHA_PACKAGES=$packages" >> $env:GITHUB_ENV

      - name: Verify generated project
        shell: pwsh
        run: dotnet run --project tests/Kairuha.TemplateSmoke --configuration Release --no-build --no-restore -- "$env:KAIRUHA_PACKAGES"

      - name: Keep Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kairuha-packages
          path: ${{ env.KAIRUHA_PACKAGES }}/*.nupkg
          if-no-files-found: error
          retention-days: 14
